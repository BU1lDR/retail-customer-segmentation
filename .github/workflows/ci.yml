name: CI

# This repository had no CI at all, which for an analysis project is a specific
# gap rather than a general one. The notebook computes 236 numbers into
# outputs/facts.json, and every other file here states some of them again: the
# README by hand, the notebook's own markdown cells by hand, and the .docx and the
# notebook's committed cell outputs as the record of whichever run last produced
# them. Nothing compared any of it.
#
# An earlier version of this comment said the .docx "is generated from that file
# and so cannot drift". Generated is a fact about tools/build_report.py, not about
# the file committed here: re-run the notebook, commit facts.json, leave the .docx
# alone, and this repository holds a report that disagrees with the analysis while
# looking untouched. The same goes for the 1.2 MB of executed outputs inside the
# notebook. Both are read against facts.json now rather than trusted.
#
# It also credited the notebook-against-its-builder comparison with catching the
# stale "20 off-peak cohorts" that facts.json said was 18. That comparison cannot
# catch it: the .ipynb is generated from tools/build_notebook.py, so a figure typed
# wrong in the builder is wrong identically in both files, they agree, and the check
# reports clean — putting the 20 back into both is enough to watch it happen. What
# catches it is reading the notebook's prose against facts.json directly, which is
# what the checker does now, over 114 anchored figures. That is the argument for
# this file, and the correction is kept rather than quietly edited out because a
# guard credited with a catch it cannot make is worse than no guard: the next person
# reads the claim instead of the code.
#
# What it deliberately does not do is run the notebook. The source workbook is
# 112 MB from UCI, is not committed, and a full execution takes minutes; a job
# that downloads it on every push would be slow, would fail on UCI's throughput
# rather than on our code, and would be switched off. So every check here reads
# only committed files. The cost of that choice is stated in the checker: it
# verifies the documents agree with facts.json, not that facts.json is right.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # nbformat only. The heavy stack in requirements.txt is what the notebook
      # needs to run; nothing here runs it, and installing pandas and
      # scikit-learn to read a JSON file would make this job twenty times slower
      # for no extra assurance.
      - name: Install what the checks need, and nothing else
        run: pip install nbformat

      - name: The documents still say what the analysis computed
        run: python tools/check_docs_drift.py

      # A tool that crashes on import is a tool nobody can run, and two of these
      # are only ever invoked by hand — months apart, usually when something else
      # has already gone wrong. Compiling them is cheap and catches the syntax
      # error that would otherwise surface at the worst moment. It is not a claim
      # that they work: build_report.py needs the figures and run_notebook.py
      # needs the data, so neither can be executed here.
      - name: The tools at least parse
        run: python -m compileall -q tools/
